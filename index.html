<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Hidden Button</title>
    <style>
        /* ডার্ক থিম ব্যাকগ্রাউন্ড */
        body {
            background-color: #0a0a0c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* প্রিমিয়াম নিয়ন বাটন ডিজাইন */
        .cyber-btn {
            position: relative;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* হোভার করলে নিয়ন গ্লো ইফেক্ট */
        .cyber-btn:hover {
            background: rgba(0, 255, 204, 0.1);
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5), 
                        inset 0 0 10px rgba(0, 255, 204, 0.2);
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
            transform: translateY(-3px);
        }

        /* লাইট সোয়াইপ এনিমেশন */
        .cyber-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .cyber-btn:hover::after {
            left: 150%;
        }

        /* ক্লিক করার সময় ইফেক্ট */
        .cyber-btn:active {
            transform: translateY(1px);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
    </style>
</head>

        }
    </script>

</body>
</html>
